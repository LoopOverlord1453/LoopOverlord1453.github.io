<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KernelForge">
  <defs>
    <linearGradient id="kf-g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34f5a4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050a14"/>
  <!-- chip pins -->
  <g stroke="url(#kf-g)" stroke-width="2.6" stroke-linecap="round">
    <path d="M22 5v6M32 5v6M42 5v6M22 53v6M32 53v6M42 53v6M5 22h6M5 32h6M5 42h6M53 22h6M53 32h6M53 42h6"/>
  </g>
  <!-- chip body -->
