  <!-- letter K drawn as board traces ending in pads -->
  <g fill="none" stroke="url(#kf-g)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 21v22"/>
    <path d="M24 32h5l10-10"/>
    <path d="M29 32l10 10"/>
  </g>
  <circle cx="40.5" cy="20.5" r="3.4" fill="#08121f" stroke="#34f5a4" stroke-width="2.2"/>
  <circle cx="40.5" cy="43.5" r="3.4" fill="#08121f" stroke="#34f5a4" stroke-width="2.2"/>
  <!-- spark at the junction -->
  <circle cx="29" cy="32" r="3.6" fill="#ffb020"/>
</svg>
