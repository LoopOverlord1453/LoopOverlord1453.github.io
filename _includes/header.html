<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="30" height="30">
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/tutorials/' | relative_url }}"{% if page.url contains '/tutorials/' %} class="current"{% endif %}>Tutorials</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects/' %} class="current"{% endif %}>Projects</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} class="current"{% endif %}>About</a>
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
    </nav>
  </div>
</header>
