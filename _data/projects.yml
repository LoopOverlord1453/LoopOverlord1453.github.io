# Project cards, in display order.
#   ref       matches the `ref` of the detail page in _projects/ (and _projects/tr/)
#   kind      badge colour: active, building, or planned
#   featured  true puts the card on the home page as well
#   detail    true means a detail page exists for this project
- ref: signal-processing-studio
  code: DSP
  kind: active
  featured: true
  detail: true
  image: /assets/img/signal-processing-studio.png
  repo: https://github.com/LoopOverlord1453/sinyal-isleme-studyosu
  tags: [Python, PyQt6, DSP, Sensor fusion, MPC, C code generation]
  en:
    title: Signal Processing Studio
    status: Active
    summary: >-
      A desktop workbench for real-time signal analysis and control design. It streams live data
      from a target board over UDP, then lets you filter it, fuse sensors, identify a model, design
      a controller, and export the result as C code for a microcontroller.
  tr:
    title: Sinyal İşleme Stüdyosu
    status: Aktif
    summary: >-
      Gerçek zamanlı sinyal analizi ve kontrol tasarımı için masaüstü uygulaması. Karttan UDP ile
      canlı veri alır; filtreleme, sensör füzyonu, model tanımlama ve kontrolcü tasarımı yapar,
      sonucu mikrodenetleyici için C koduna dönüştürür.

- ref: uml-design-studio
  code: UML
  kind: active
  featured: true
  detail: true
  image: /assets/img/uml-design-studio.png
  repo: https://github.com/LoopOverlord1453/uml-design-studio
  tags: [Python, PyQt6, UML, State machines, MISRA, Code generation]
  en:
    title: UML Design Studio
    status: Open source
    summary: >-
      Draw a UML 2.5.1 state machine or class diagram and generate MISRA-aware C11 or C++11 for a
      microcontroller project. The diagram is the source, so the firmware and the design document
      cannot drift apart.
  tr:
    title: UML Design Studio
    status: Açık kaynak
    summary: >-
      UML 2.5.1 durum makinesi veya sınıf diyagramı çizip mikrodenetleyici projesi için MISRA
      uyumlu C11 veya C++11 kodu üreten editör. Kaynak diyagramın kendisidir; kod ile tasarım
      belgesi birbirinden kopamaz.

