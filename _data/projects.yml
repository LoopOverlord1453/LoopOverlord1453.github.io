- title: Signal Processing Studio
  code: DSP
  status: Active
  status_kind: active
  featured: true
  image: /assets/img/signal-processing-studio.png
  summary: >-
    A desktop workbench for real-time signal analysis and control design. It streams live data
    from a target board over UDP, then lets you filter it, fuse sensors, identify a model, design
    a controller, and export the result as C code for a microcontroller.
  tags: [Python, PyQt6, DSP, Sensor fusion, MPC, C code generation]
  link: https://github.com/LoopOverlord1453/sinyal-isleme-studyosu
  link_label: Source on GitHub

